# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

permissions: read-all

on:
  push:
    branches: [ "main" ]
  # Alle PR's, ook die in een stack bovenop een andere branch.
  pull_request:

jobs:
  build:
    # Unieke naam: deze check is verplicht op main, en deploy.yml heeft ook een job 'build'.
    name: Maven verify
    permissions:
      contents: write # required for maven-dependency-submission-action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Volledige historie: de dekkingscontrole hieronder vergelijkt met de basisbranch.
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        # verify i.p.v. package: de JaCoCo-coverage-gate hangt aan fase verify.
        run: mvn -B verify --file pom.xml
      - name: Dekking van gewijzigde regels
        # Elke regel in src/main/java die deze PR toevoegt of wijzigt, moet door een test geraakt
        # worden. diff-cover kijkt per regel, niet per branch; de branches bewaakt de JaCoCo-gate.
        if: github.event_name == 'pull_request'
        env:
          BASIS: origin/${{ github.base_ref }}
        run: |
          python3 -m venv /tmp/diff-dekking
          /tmp/diff-dekking/bin/pip install --quiet --require-hashes -r .github/diff-dekking/requirements.txt
          /tmp/diff-dekking/bin/diff-cover target/site/jacoco/jacoco.xml \
            --compare-branch="$BASIS" --src-roots src/main/java --include 'src/main/java/**' \
            --format json:diff-dekking.json,markdown:diff-dekking.md --quiet
          cat diff-dekking.md >> "$GITHUB_STEP_SUMMARY"
          python3 .github/diff-dekking/controleer.py diff-dekking.json
      # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c
