version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/.clusterfuzzlite"
    schedule:
      interval: "weekly"
    ignore:
      # De NMC compileert met --release 25; een nieuwere JDK-major kiezen we zelf.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: /
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
