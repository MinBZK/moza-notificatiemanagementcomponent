quarkus.openapi-generator.codegen.input-base-dir=src/main/resources/openapi
quarkus.openapi-generator.codegen.spec.profielservice_api_json.base-package=nl.rijksoverheid.moz.nmc.client.profielservice.generated
quarkus.openapi-generator.codegen.spec.profielservice_api_json.config-key=profielservice
quarkus.openapi-generator.codegen.spec.notifynl_api_yaml.base-package=nl.rijksoverheid.moz.nmc.client.notifynl.generated
quarkus.openapi-generator.codegen.spec.notifynl_api_yaml.config-key=notify

quarkus.rest-client.profielservice.url=
%dev.quarkus.rest-client.profielservice.url=http://localhost:8080
%test.quarkus.rest-client.profielservice.url=http://localhost:8081

quarkus.rest-client.notify.url=
%test.quarkus.rest-client.notify.url=https://notifynl.example.invalid
notify.api-key=
# Vorm die NotifyNL hanteert (naam-<serviceId>-<secret>); korter dan 74 tekens wordt afgekeurd.
%test.notify.api-key=niet-voor-productie-00000000-0000-0000-0000-000000000000-11111111-1111-1111-1111-111111111111

notify.callback.bearer-token=
%test.notify.callback.bearer-token=test-callback-token-niet-voor-productie

# Hoelang een notificatie mag blijven staan zonder nieuwe statusregistratie. 7 dagen conform de
# afspraak met de Belastingdienst. Geen default in de code: niet gezet hoort te falen bij opstarten.
notificatie.retentie.bewaartermijn=7d
notificatie.retentie.cron=0 0 3 * * ?
# Bovengrens op het aantal batches van 1000 per run; 10.000 is 10 miljoen notificaties in één nacht.
# Verlaag dit om een run te begrenzen; wat blijft staan gaat mee met de volgende run.
notificatie.retentie.max-batches=10000

# Geheime pepper voor HashHelper (keyed HMAC-SHA-256) — leeg hier, lokaal in te vullen via
# application-dev.properties (niet ingecheckt), in productie via het secret-mechanisme.
hash.pepper=
%test.hash.pepper=test-pepper-niet-voor-productie

# KEK voor Sleutelbeheer: de huidige versie plus per versie een base64-sleutel van 32 bytes. Leeg
# hier, net als hash.pepper; in productie NMC_KEK_HUIDIGE_VERSIE en NMC_KEK_VERSIE_<n>.
nmc.kek.huidige-versie=
nmc.kek.versie.1=
%test.nmc.kek.huidige-versie=1
# base64 van "test-kek-niet-voor-productie-001"
%test.nmc.kek.versie.1=dGVzdC1rZWstbmlldC12b29yLXByb2R1Y3RpZS0wMDE=

# Eén geconfigureerde dienstverlener tot de tokenvalidatie er is; de rij komt uit migratie V8.
nmc.dienstverlener.id=00000000-0000-4000-8000-000000000001

# Worker-lus: hoe vaak per soort een ronde draait, hoeveel taken een ronde claimt, hoelang een lease
# geldt en na hoeveel mislukkingen in het NMC zelf een taak op mislukt gaat. In tests staat de lus uit
# en roepen de tests een ronde zelf aan.
nmc.taak.interval=5s
%test.nmc.taak.interval=off
nmc.taak.batch=100
nmc.taak.lease=2m
nmc.taak.max-pogingen=5
%test.nmc.taak.max-pogingen=2

# Verzendbudget: tokens per Notify-service per minuut, waarvan een vast deel voor de navraag is.
# De waarde is een afspraak met de NotifyNL-beheerder, geen technische bovengrens.
nmc.verzendbudget.notify-service=standaard
nmc.verzendbudget.tokens-per-minuut=600
nmc.verzendbudget.navraag-reservering=100
%test.nmc.verzendbudget.tokens-per-minuut=20
%test.nmc.verzendbudget.navraag-reservering=5

# Eventfeed: de grootste pagina, het aantal aanroepen per dienstverlener per minuut (geteld per pod)
# en het cluster-epoch in de cursor. Beheer verhoogt het epoch bij herstel uit back-up of een
# promotie waarbij de transactie-id-reeks niet doorloopt; elke oudere cursor krijgt dan 410.
nmc.feed.max-pagina=500
nmc.feed.max-aanroepen-per-minuut=60
nmc.feed.cluster-epoch=1
%test.nmc.feed.max-pagina=10

mp.openapi.scan.disable=true
mp.openapi.info.version=0.1.0

# Jacoco. quarkus-jacoco regelt de dekking van @QuarkusTest (die bytecode augmenteert); de
# reguliere jacoco-maven-plugin instrumenteert de plain-unittests. Beide schrijven naar dezelfde
# execdata (reuse-data-file), zodat het gecombineerde rapport álle tests dekt i.p.v. alleen de
# QuarkusTests. Gegenereerde OpenAPI-code (interfaces, modellen, clients) valt buiten de cijfers.
# quarkus-jacoco is test-scoped: in het gepackagede image (prod-profiel) bestaat de extensie
# niet, dus alleen onder %test zetten — anders "Unrecognized configuration key" bij containerstart.
%test.quarkus.jacoco.reuse-data-file=true
%test.quarkus.jacoco.data-file=target/jacoco.exec
%test.quarkus.jacoco.excludes=**/api/**,**/generated/**

# Container-image (jib). Group/registry/tag/push/credentials komen uit de CI-flags
# (-Dquarkus.container-image.*), niet uit deze file. Alleen de image-naam staat hier
# vast voor een stabiele coordinaat: <registry>/<group>/notificatiemanagementcomponent.
quarkus.container-image.name=moza-notificatiemanagementcomponent
# Java 25: jib's default UBI-runtime-base volgt geen 25 → expliciete JRE-base pinnen
# (zelfde runtime als de oude Dockerfile).
quarkus.jib.base-jvm-image=eclipse-temurin:25-jre
# Niet als root draaien (mirror van de oude Dockerfile USER 1001). Numerieke uid hoeft
# niet in /etc/passwd te staan om te draaien.
quarkus.jib.user=1001

quarkus.datasource.db-kind=postgresql
# Credentials en JDBC-url komen uit de runtime-omgeving via env-var name-mangling:
# QUARKUS_DATASOURCE_USERNAME / _PASSWORD / _JDBC_URL overschrijven deze properties. Die
# env-vars worden per deployomgeving gezet (ZAD-deployment voor PR-previews, het
# release-cluster voor echte releases). Geen creds hier (de localhost-url is enkel een
# onschuldige default; %dev/%test zetten hun eigen).
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/nmc
quarkus.hibernate-orm.schema-management.strategy=validate
# De jsonb-kolom taak.payload: Hibernate gebruikt zijn eigen Jackson-mapper, los van die van de
# REST-laag, zodat aanpassingen daar de opslag niet raken.
quarkus.hibernate-orm.mapping.format.global=ignore

quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
%prod.quarkus.flyway.migrate-at-start=false

%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=nmc
%dev.quarkus.datasource.password=nmc
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/nmc

# Tests draaien op een echte PostgreSQL die EmbeddedPostgresTestResource als kindproces van de
# test-JVM start; die levert url, gebruiker en wachtwoord. Dev Services uit, anders probeert
# Quarkus bij het ontbreken van een url een container te starten.
%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.devservices.enabled=false

logboekdataverwerking.enabled=false
logboekdataverwerking.service-name=notificatiemanagementcomponent

%prod.logboekdataverwerking.enabled=
%prod.logboekdataverwerking.clickhouse.endpoint=
%prod.logboekdataverwerking.clickhouse.username=
%prod.logboekdataverwerking.clickhouse.password=
%prod.logboekdataverwerking.clickhouse.database=
%prod.logboekdataverwerking.clickhouse.table=

# Verzendtaak en navraag: uitstel na een storing bij NotifyNL of de Profielservice (kost de notificatie
# geen poging).
nmc.taak.uitstel=5m
# Navraag naar de afleverstatus: momenten na de verzending, daarna dagelijks tot de bewaartermijn van NotifyNL.
nmc.navraag.momenten=1h,6h,24h
nmc.navraag.bewaartermijn-notifynl=7d
# Termijn uit de MEBV na delivered, plus het callback-venster van NotifyNL als marge.
nmc.vaststelling.termijn=7d
nmc.vaststelling.callback-venster=1d

# Webhook: de terugkoppeltaak per dienstverlener met een webhook. Hoe snel hij na een lege ronde weer
# kijkt, hoeveel events per aanroep meegaan (niet meer dan nmc.feed.max-pagina), na hoeveel mislukte
# leveringen op rij de webhook pauzeert als het register daar niets over zegt, de wachttijd vóór en
# tijdens de pauze (verdubbelt per mislukking, ten hoogste een dag) en de time-out per aanroep.
nmc.webhook.interval=10s
nmc.webhook.bundel=100
nmc.webhook.max-mislukkingen=5
nmc.webhook.herpoging-wachttijd=30s
nmc.webhook.pauze-wachttijd=15m
nmc.webhook.timeout=10s
%test.nmc.webhook.max-mislukkingen=2
%test.nmc.webhook.bundel=3

# Ondertekening van de JWT op elke webhook-aanroep: een RSA-sleutel van minstens 2048 bits als
# PKCS#8-PEM (kop- en voetregel en regelafbrekingen mogen weg) en de sleutel-id die de JWKS
# publiceert. Leeg hier, net als hash.pepper; in productie NMC_WEBHOOK_JWT_PRIVATE_KEY en
# NMC_WEBHOOK_JWT_KEY_ID. Zonder sleutel start de applicatie niet.
nmc.webhook.jwt.private-key=
nmc.webhook.jwt.key-id=
nmc.webhook.jwt.issuer=https://mijnoverheidzakelijk.nl/nmc
nmc.webhook.jwt.geldigheid=5m
%test.nmc.webhook.jwt.key-id=test-webhook-sleutel-niet-voor-productie
%test.nmc.webhook.jwt.private-

# Controletaak: hoe vaak ze notificaties zonder taak zoekt en hoeveel ze er per ronde herstelt.
nmc.controle.interval=5m
nmc.controle.max-per-ronde=1000
