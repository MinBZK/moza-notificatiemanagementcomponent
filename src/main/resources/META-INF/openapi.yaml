openapi: 3.0.3
info:
  title: NotificatieManagementComponent API
  description: |
    API voor het versturen van notificaties namens een Dienstverlener.
  version: 0.1.0
  contact:
    name: MijnOverheid Zakelijk Team
    email: moza@minbzk.nl
    url: https://github.com/MinBZK/moza-notificatiemanagementcomponent

# Bewust geen `servers:` blok: zonder dit blok gebruikt Swagger UI de origin
# waarvandaan de spec geladen is. Daardoor wijst "Try it out" altijd naar de
# juiste host — lokaal `localhost`, elke PR-deploy zijn eigen `pr-N`-host, prod
# de prod-host — zonder per-omgeving een URL te hoeven invullen.

tags:
  - name: CentraleNotificaties
    description: >-
      Centrale notificaties (centraal profiel); de NMC raadpleegt de Profielservice
      voor de contactgegevens van de ontvanger.
  - name: DecentraleNotificaties
    description: >-
      Decentrale notificaties (decentraal profiel / doorgeefluik); de aanroeper heeft
      de contactgegevens zelf al bepaald en levert het e-mailadres rechtstreeks aan.
  - name: Wijzigingen
    description: >-
      De eventfeed: de statusovergangen van de notificaties van de Dienstverlener als
      CloudEvents, gelezen met een cursor en bevestigd door die cursor terug te schrijven.

paths:
  /api/nmc/v1/centraal/notificaties:
    post:
      operationId: notificatieVersturen
      summary: Notificatie versturen
      description: |
        Neemt de notificatie aan op een identificerend nummer en antwoordt 202 zodra ze
        duurzaam is opgeslagen. De verzending volgt asynchroon: het NMC haalt dan het
        e-mailadres op bij de Profielservice en biedt het bericht aan bij NotifyNL. Is
        er geen partij of geen e-mailadres, dan eindigt de notificatie in
        `niet-bezorgbaar` met reden `geen-contactgegevens`. Als een callbackUrl is
        meegegeven, stuurt de NMC een statusupdate (CloudEvents) bij elke overgang die
        op een delivery receipt volgt.
      tags:
        - CentraleNotificaties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificatieAanvraagRequest'
      # Bewust dubbel met de callbackUrl-beschrijving: die ziet een afnemer in Swagger UI direct
      # bij het veld, dit blok pas na doorklikken.
      callbacks:
        statusupdate:
          '{$request.body#/callbackUrl}':
            post:
              summary: Statusupdate (CloudEvents NL GOV)
              description: |
                De NMC stuurt deze callback bij elke statusovergang die volgt op een
                delivery receipt van NotifyNL, en alleen als bij de aanvraag een
                `callbackUrl` is meegegeven. De callback gaat pas uit nadat de overgang is
                vastgelegd.

                De NMC doet maximaal drie pogingen met oplopende tussenpozen. Slagen
                die geen van alle, dan wordt de statusupdate niet opnieuw aangeboden;
                de Dienstverlener kan de status dan alleen nog zelf opvragen (nog niet beschikbaar).

                Callbacks kunnen in een andere volgorde aankomen dan de overgangen
                plaatsvonden. `sequence` loopt per notificatie op; verwerk per `subject`
                op `sequence` en negeer een lager volgnummer na een hoger.
              requestBody:
                required: true
                content:
                  application/cloudevents+json:
                    schema:
                      $ref: '#/components/schemas/NotificatieStatusEvent'
              responses:
                '2XX':
                  description: Statusupdate ontvangen
      responses:
        '202':
          description: >-
            Notificatie aangenomen en duurzaam opgeslagen; de verzending volgt asynchroon. De
            uitkomst komt via de callback (als er een `callbackUrl` is) of via de status van de
            notificatie.
          headers:
            API-Version:
              schema:
                type: string
              description: Versie van de API
            Location:
              schema:
                type: string
              description: Pad van de aangenomen notificatie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificatieResponse'
        '400':
          description: >-
            Ongeldige aanvraag, zoals een onbekend berichttype. Bij bean-validatie, zoals
            een ongeldige callbackUrl, is `violations` gevuld. Een partij zonder
            e-mailadres is geen 400 meer: die uitkomst volgt asynchroon als
            `niet-bezorgbaar`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: >-
            Het quotum van de Dienstverlener voor vandaag is bereikt
            (`type` `https://mijnoverheidzakelijk.nl/nmc/problemen/quotum-overschreden`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: De notificatie kon niet worden aangenomen
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/nmc/v1/decentraal/notificaties:
    post:
      operationId: decentraleNotificatieVersturen
      summary: Notificatie versturen op basis van een e-mailadres
      description: |
        Neemt een notificatie aan voor het opgegeven e-mailadres, zonder de Profielservice
        te raadplegen (decentraal profiel / doorgeefluik), en antwoordt 202 zodra ze
        duurzaam is opgeslagen. De verzending bij NotifyNL volgt asynchroon. Als een
        callbackUrl is meegegeven, stuurt de NMC een statusupdate (CloudEvents) bij elke
        overgang die op een delivery receipt volgt.
      tags:
        - DecentraleNotificaties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecentraleNotificatieAanvraagRequest'
      # Bewust dubbel met de callbackUrl-beschrijving: die ziet een afnemer in Swagger UI direct
      # bij het veld, dit blok pas na doorklikken.
      callbacks:
        statusupdate:
          '{$request.body#/callbackUrl}':
            post:
              summary: Statusupdate (CloudEvents NL GOV)
              description: |
                De NMC stuurt deze callback bij elke statusovergang die volgt op een
                delivery receipt van NotifyNL, en alleen als bij de aanvraag een
                `callbackUrl` is meegegeven. De callback gaat pas uit nadat de overgang is
                vastgelegd.

                De NMC doet maximaal drie pogingen met oplopende tussenpozen. Slagen
                die geen van alle, dan wordt de statusupdate niet opnieuw aangeboden;
                de Dienstverlener kan de status dan alleen nog zelf opvragen (nog niet beschikbaar).

                Callbacks kunnen in een andere volgorde aankomen dan de overgangen
                plaatsvonden. `sequence` loopt per notificatie op; verwerk per `subject`
                op `sequence` en negeer een lager volgnummer na een hoger.
              requestBody:
                required: true
                content:
                  application/cloudevents+json:
                    schema:
                      $ref: '#/components/schemas/NotificatieStatusEvent'
              responses:
                '2XX':
                  description: Statusupdate ontvangen
      responses:
        '202':
          description: >-
            Notificatie aangenomen en duurzaam opgeslagen; de verzending volgt asynchroon. De
            uitkomst komt via de callback (als er een `callbackUrl` is) of via de status van de
            notificatie.
          headers:
            API-Version:
              schema:
                type: string
              description: Versie van de API
            Location:
              schema:
                type: string
              description: Pad van de aangenomen notificatie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificatieResponse'
        '400':
          description: >-
            Ongeldige aanvraag (bijv. ontbrekend/ongeldig e-mailadres of onbekend
            berichttype). Bij bean-validatie, zoals een ongeldig e-mailadres of een
            ongeldige callbackUrl, is `violations` gevuld.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: >-
            Het quotum van de Dienstverlener voor vandaag is bereikt
            (`type` `https://mijnoverheidzakelijk.nl/nmc/problemen/quotum-overschreden`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: De notificatie kon niet worden aangenomen
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/nmc/v1/notificaties/wijzigingen:
    get:
      operationId: wijzigingenLezen
      summary: Statusovergangen lezen vanaf een cursor
      description: |
        Geeft de statusovergangen van de notificaties van de Dienstverlener terug als
        CloudEvents (NL GOV profiel), in commitvolgorde, vanaf de meegegeven cursor. Zonder
        cursor begint de pagina bij het oudste beschikbare event. Elk antwoord draagt de
        cursor voor de volgende pagina; een lege pagina betekent dat er op dit moment niets
        nieuws is.

        Een event verschijnt pas in de feed nadat elke oudere transactie is afgerond, zodat
        een cursor nooit een laat gecommit event overslaat. De feed garandeert geen volgorde
        tussen events van dezelfde notificatie: verwerk per `subject` op `sequence` en negeer
        een lager volgnummer na een hoger.

        De cursor is een ondoorzichtige tekst. Hij vervalt (410) wanneer het cluster na een
        herstel uit back-up een nieuw epoch heeft gekregen, of wanneer hij onder het oudste
        beschikbare event wijst omdat dat deel van het log is opgeruimd; lees dan opnieuw
        zonder cursor. De paginagrootte is begrensd op een geconfigureerd maximum en het
        aantal aanroepen per Dienstverlener per minuut ook (429).
      tags:
        - Wijzigingen
      parameters:
        - name: cursor
          in: query
          required: false
          description: De cursor uit het vorige antwoord; weglaten om bij het oudste beschikbare event te beginnen
          schema:
            type: string
            maxLength: 200
        - name: limiet
          in: query
          required: false
          description: Het gewenste aantal events per pagina; meer dan het geconfigureerde maximum levert het maximum
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        '200':
          description: Een pagina events met de cursor voor de volgende pagina
          headers:
            API-Version:
              schema:
                type: string
              description: Versie van de API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WijzigingenPagina'
        '400':
          description: De cursor is niet te ontleden of `limiet` is kleiner dan 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: >-
            De cursor is vervallen: een ander cluster-epoch of onder het oudste beschikbare
            event. Lees opnieuw zonder cursor.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CursorVervallenProblem'
        '429':
          description: De aanroeplimiet per Dienstverlener per minuut is bereikt
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AanroeplimietProblem'

  /api/nmc/v1/notificaties/wijzigingen/bevestiging:
    put:
      operationId: wijzigingenBevestigen
      summary: Verwerkte statusovergangen bevestigen
      description: |
        Legt vast tot welke cursor de Dienstverlener de events heeft verwerkt. De NMC bewaart
        per Dienstverlener één bevestiging en zet die alleen vooruit: een cursor die ouder is
        dan de bewaarde bevestiging verandert niets en krijgt toch `204`. Een vervallen cursor
        (ander cluster-epoch of onder het oudste beschikbare event) krijgt `410`.
      tags:
        - Wijzigingen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BevestigingRequest'
      responses:
        '204':
          description: Bevestiging vastgelegd, of ouder dan de bewaarde bevestiging en daarom ongewijzigd
          headers:
            API-Version:
              schema:
                type: string
              description: Versie van de API
        '400':
          description: De cursor ontbreekt of is niet te ontleden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: De cursor is vervallen; lees de feed opnieuw zonder cursor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CursorVervallenProblem'

components:
  schemas:
    IdentificatieType:
      type: string
      description: Type identificatie van de ontvanger
      enum:
        - BSN
        - KVK
        - RSIN

    NotificatieAanvraagRequest:
      type: object
      description: Aanvraag om een notificatie te versturen
      required:
        - identificatieType
        - identificatieNummer
        - dienstverlener
        - berichtType
      properties:
        identificatieType:
          $ref: '#/components/schemas/IdentificatieType'
        identificatieNummer:
          type: string
          minLength: 1
          pattern: '^.*\S.*$'
          description: BSN-, KVK- of RSIN-nummer van de ontvanger
        dienstverlener:
          type: string
          minLength: 1
          description: Naam van de dienstverlener namens wie de notificatie wordt verstuurd
        dienst:
          type: string
          minLength: 1
          description: Naam van de dienst waarvoor de notificatie wordt verstuurd (optioneel)
        berichtType:
          type: string
          minLength: 1
          description: "Type bericht dat verstuurd wordt (bepaalt de te gebruiken template). Geaccepteerde berichttype(n) zijn:\n- Stuurgroep Agenda\n- Demo template"
        berichtgegevens:
          type: object
          description: Templatevariabelen voor het bericht
          additionalProperties:
            type: string
        callbackUrl:
          type: string
          format: uri
          # `format: uri` typeert het veld als java.net.URI, waar Hibernate Validator geen
          # @Size-validator voor heeft (HV000030). Vandaar een eigen constraint in plaats van
          # maxLength; die dekt meteen de scheme-, host- en poortregels uit de description.
          x-field-extra-annotation: "@nl.rijksoverheid.moz.nmc.validation.ValidCallbackUrl"
          # Literal block (|) en geen folded (>-): een folded scalar plakt gelijk-ingesprongen
          # regels aan elkaar met spaties, waardoor de markdown-tabel hieronder als één
          # doorlopende regel in het gepubliceerde document belandt en Swagger UI er geen tabel
          # van maakt.
          description: |
            Optionele URL waarop de NMC asynchroon een statusupdate (CloudEvents NL GOV)
            terugstuurt zodra de bezorgstatus bekend is.

            De statusupdate is een CloudEvent per statusovergang, met `subject` de
            notificatie-id, `sequence` het volgnummer van de overgang en in `data` de
            statussen `van` en `naar`, de `reden` en de `versie`. De statussen staan
            beschreven bij het schema `NotificatieStatus`. Verwerk per `subject` op
            `sequence`: callbacks kunnen in een andere volgorde aankomen. De NMC doet
            maximaal drie pogingen en biedt daarna niet opnieuw aan.

            Weglaten als de Dienstverlener geen statusupdates wil ontvangen.
            Alleen een absolute https-URL naar een publieke hostnaam (maximaal 2048
            tekens, zonder gebruikersinfo) wordt geaccepteerd; IP-adressen en interne
            hostnamen worden geweigerd (400).

    DecentraleNotificatieAanvraagRequest:
      type: object
      description: >-
        Aanvraag om een notificatie te versturen naar een reeds bekend e-mailadres
        (decentraal profiel; geen Profielservice-lookup)
      required:
        - emailAdres
        - berichtType
      properties:
        emailAdres:
          type: string
          format: email
          # De generator maakt hier geen @Email van, dus het formaat staat expliciet als
          # `pattern`.
          pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
          description: E-mailadres van de ontvanger
        berichtType:
          type: string
          minLength: 1
          description: "Type bericht dat verstuurd wordt (bepaalt de te gebruiken template). Geaccepteerde berichttype(n) zijn:\n- Stuurgroep Agenda\n- Demo template"
        berichtgegevens:
          type: object
          description: Templatevariabelen voor het bericht
          additionalProperties:
            type: string
        callbackUrl:
          type: string
          format: uri
          # Zie de toelichting bij NotificatieAanvraagRequest.callbackUrl.
          x-field-extra-annotation: "@nl.rijksoverheid.moz.nmc.validation.ValidCallbackUrl"
          # Literal block (|) en geen folded (>-): een folded scalar plakt gelijk-ingesprongen
          # regels aan elkaar met spaties, waardoor de markdown-tabel hieronder als één
          # doorlopende regel in het gepubliceerde document belandt en Swagger UI er geen tabel
          # van maakt.
          description: |
            Optionele URL waarop de NMC asynchroon een statusupdate (CloudEvents NL GOV)
            terugstuurt zodra de bezorgstatus bekend is.

            De statusupdate is een CloudEvent per statusovergang, met `subject` de
            notificatie-id, `sequence` het volgnummer van de overgang en in `data` de
            statussen `van` en `naar`, de `reden` en de `versie`. De statussen staan
            beschreven bij het schema `NotificatieStatus`. Verwerk per `subject` op
            `sequence`: callbacks kunnen in een andere volgorde aankomen. De NMC doet
            maximaal drie pogingen en biedt daarna niet opnieuw aan.
            Alleen een absolute https-URL naar een publieke hostnaam (maximaal 2048
            tekens, zonder gebruikersinfo) wordt geaccepteerd; IP-adressen en interne
            hostnamen worden geweigerd (400).

    NotificatieResponse:
      type: object
      required:
        - notificatieId
      properties:
        notificatieId:
          type: string
          format: uuid
          description: NMC-interne referentie voor deze notificatie

    NotificatieStatusEvent:
      type: object
      description: >-
        Statusovergang als CloudEvent (NL GOV profiel). De envelop volgt CloudEvents 1.0;
        de overgang zelf staat in `data`.
      required:
        - specversion
        - id
        - type
        - source
        - subject
        - time
        - datacontenttype
        - sequence
        - sequencetype
        - data
      properties:
        specversion:
          type: string
          example: '1.0'
        id:
          type: string
          description: >-
            Het id van het event in het eventlog, als tekst. Hetzelfde event heeft in de
            feed en in de callback hetzelfde `id`, zodat een Dienstverlener die beide
            gebruikt dubbele verwerking kan herkennen.
          example: '1042'
        type:
          type: string
          description: >-
            `nl.overheid.moz.notificatie.status.` gevolgd door de nieuwe status, bijvoorbeeld
            `nl.overheid.moz.notificatie.status.bezorgd`.
          example: nl.overheid.moz.notificatie.status.bezorgd
        source:
          type: string
          format: uri-reference
          example: /api/nmc/v1/notificaties/3f1a...
        subject:
          type: string
          description: De notificatie-id die bij de aanvraag is teruggegeven
          example: 3f1a...
        time:
          type: string
          format: date-time
          description: Tijdstip waarop de NMC de statusovergang vastlegde
        datacontenttype:
          type: string
          example: application/json
        sequence:
          type: string
          pattern: '^[0-9]+$'
          description: >-
            Volgnummer van de overgang, per notificatie oplopend, als string volgens de
            sequence-extensie van CloudEvents. Gelijk aan `data.versie`.
        sequencetype:
          type: string
          enum:
            - Integer
        data:
          $ref: '#/components/schemas/NotificatieStatusData'

    NotificatieStatusData:
      type: object
      description: >-
        Eén statusovergang. `van` ontbreekt bij het eerste event van een notificatie en
        `reden` ontbreekt bij een overgang zonder reden, zoals naar `bezorgd`.
      required:
        - naar
        - versie
      properties:
        van:
          $ref: '#/components/schemas/NotificatieStatus'
        naar:
          $ref: '#/components/schemas/NotificatieStatus'
        reden:
          $ref: '#/components/schemas/Reden'
        versie:
          type: integer
          format: int64
          description: Het volgnummer van de overgang, gelijk aan `sequence` in de envelop

    NotificatieStatus:
      type: string
      description: |
        Status van de notificatie.

        | Waarde | Betekenis |
        |---|---|
        | `aangenomen` | Door de NMC vastgelegd, nog niet aangeboden bij NotifyNL |
        | `in-verzending` | Wordt aangeboden bij NotifyNL |
        | `verzonden` | Aangeboden bij NotifyNL, nog geen uitkomst |
        | `bezorgd` | Bezorgd; NotifyNL kan tot zeven dagen daarna nog een fout melden |
        | `definitief-bezorgd` | Bezorgd en niet herroepen binnen de vaststellingstermijn |
        | `niet-bezorgbaar` | Niet bezorgd; zie `reden` |
        | `technisch-mislukt` | Niet bezorgd door een storing aan de verzendkant |
        | `bezorgstatus-onbekend` | NotifyNL heeft geen uitkomst gemeld; een latere melding kan dit nog corrigeren |
        | `verlopen` | Niet meer verzonden omdat de geldigheid verstreek |
        | `geannuleerd` | Geannuleerd vóór de verzending |

        `aangenomen`, `in-verzending`, `verzonden` en `bezorgd` zijn geen eindstatus.
      enum:
        - aangenomen
        - in-verzending
        - verzonden
        - bezorgd
        - definitief-bezorgd
        - niet-bezorgbaar
        - technisch-mislukt
        - bezorgstatus-onbekend
        - verlopen
        - geannuleerd

    Reden:
      type: string
      description: |
        Reden bij een status waarin de notificatie niet bezorgd is.

        | Waarde | Betekenis |
        |---|---|
        | `onbereikbaar` | Het adres bestaat niet of de ontvanger is niet bereikbaar |
        | `geen-contactgegevens` | Geen bruikbaar adres voor de opgegeven partij |
        | `verlopen` | De geldigheid van de notificatie verstreek |
        | `geannuleerd` | De Dienstverlener heeft geannuleerd |
        | `technisch` | Een storing aan de verzendkant |
      enum:
        - onbereikbaar
        - geen-contactgegevens
        - verlopen
        - geannuleerd
        - technisch

    WijzigingenPagina:
      type: object
      description: >-
        Eén pagina uit de eventfeed. `events` zijn de CloudEvents in commitvolgorde; `cursor`
        is de positie ná het laatste event van deze pagina, mee te geven bij de volgende aanroep
        en terug te schrijven als bevestiging. Bij een lege pagina is `cursor` gelijk aan de
        meegegeven cursor en ontbreekt hij als er nog geen event is.
      required:
        - events
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/NotificatieStatusEvent'
        cursor:
          type: string
          description: De cursor voor de volgende pagina; een ondoorzichtige tekst
          example: MTo0MjoxMDQy

    BevestigingRequest:
      type: object
      required:
        - cursor
      properties:
        cursor:
          type: string
          minLength: 1
          maxLength: 200
          description: De cursor uit de laatste volledig verwerkte pagina

    CursorVervallenProblem:
      description: >-
        De cursor is vervallen: het cluster-epoch in de cursor is niet het huidige, of de
        cursor wijst onder het oudste beschikbare event. Lees de feed opnieuw zonder cursor.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            type:
              type: string
              enum:
                - https://mijnoverheidzakelijk.nl/nmc/problemen/cursor-vervallen

    AanroeplimietProblem:
      description: >-
        De Dienstverlener heeft in de lopende minuut meer aanroepen op de feed gedaan dan
        toegestaan. Probeer het in de volgende minuut opnieuw.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            type:
              type: string
              enum:
                - https://mijnoverheidzakelijk.nl/nmc/problemen/aanroeplimiet-overschreden

    Problem:
      type: object
      description: Problem Details (RFC 9457)
      properties:
        type:
          type: string
          format: uri
          default: "about:blank"
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        violations:
          type: array
          description: >-
            Gevuld als de aanvraag door bean-validatie is afgekeurd, bijvoorbeeld bij een
            ongeldig e-mailadres of een ongeldige callbackUrl. `detail` blijft dan leeg;
            de reden staat per veld in deze lijst.
          items:
            $ref: '#/components/schemas/Violation'

    Violation:
      type: object
      description: Eén afgekeurd veld uit de aanvraag
      properties:
        field:
          type: string
          description: Het veld waarop de validatie is mislukt
          example: notificatieAanvraagRequest.callbackUrl
        in:
          type: string
          description: >-
            Het deel van het HTTP-verzoek waar de validatiefout optrad, zoals query, path,
            header, form of body. Voor velden in de requestbody staat hier `?`.
        message:
          type: string
          description: Omschrijving van de validatiefout
