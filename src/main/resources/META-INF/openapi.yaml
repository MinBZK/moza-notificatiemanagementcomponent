openapi: 3.0.3
info:
  title: NotificatieManagementComponent API
  description: |
    API voor het versturen van notificaties namens een Dienstverlener.
  version: 0.1.0
  contact:
    name: MijnOverheid Zakelijk Team
    email: moza@minbzk.nl
    url: https://github.com/MinBZK/moza-notificatiemanagementcomponent

# Bewust geen `servers:` blok: zonder dit blok gebruikt Swagger UI de origin
# waarvandaan de spec geladen is. Daardoor wijst "Try it out" altijd naar de
# juiste host — lokaal `localhost`, elke PR-deploy zijn eigen `pr-N`-host, prod
# de prod-host — zonder per-omgeving een URL te hoeven invullen.

tags:
  - name: CentraleNotificaties
    description: >-
      Centrale notificaties (centraal profiel); de NMC raadpleegt de Profielservice
      voor de contactgegevens van de ontvanger.
  - name: DecentraleNotificaties
    description: >-
      Decentrale notificaties (decentraal profiel / doorgeefluik); de aanroeper heeft
      de contactgegevens zelf al bepaald en levert het e-mailadres rechtstreeks aan.

paths:
  /api/nmc/v1/centraal/notificaties:
    post:
      operationId: notificatieVersturen
      summary: Notificatie versturen
      description: |
        Haalt de contactgegevens op bij de Profielservice, verstuurt de notificatie
        en slaat de notificatie op. Als een callbackUrl is meegegeven, stuurt de
        NMC asynchroon een statusupdate (CloudEvents) zodra de bezorgstatus bekend is.
      tags:
        - CentraleNotificaties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificatieAanvraagRequest'
      callbacks:
        statusupdate:
          '{$request.body#/callbackUrl}':
            post:
              summary: Statusupdate (CloudEvents NL GOV)
              description: |
                De NMC stuurt deze callback zodra NotifyNL de bezorgstatus terugmeldt,
                en alleen als bij de aanvraag een `callbackUrl` is meegegeven. De
                callback gaat pas uit nadat de status is vastgelegd.

                De NMC doet maximaal drie pogingen met oplopende tussenpozen. Slagen
                die geen van alle, dan wordt de statusupdate niet opnieuw aangeboden;
                de Dienstverlener kan de status dan alleen nog zelf opvragen.

                Een status komt hooguit één keer voorbij. Een herhaalde of laat
                aangekomen melding van NotifyNL die geen vooruitgang is op de al
                vastgelegde status, levert geen callback op — een bezorging wordt dus
                nooit teruggedraaid naar een foutstatus.
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/NotificatieStatusEvent'
              responses:
                '2XX':
                  description: Statusupdate ontvangen
      responses:
        '200':
          description: Notificatie succesvol verstuurd
          headers:
            API-Version:
              schema:
                type: string
              description: Versie van de API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificatieResponse'
        '400':
          description: >-
            Ongeldige aanvraag, of er kon geen notificatie worden gedaan voor de
            opgegeven partij (geen partij of geen e-mailadres gevonden voor de
            opgegeven identificatie)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: De notificatie kon niet (succesvol) verzonden worden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /api/nmc/v1/decentraal/notificaties:
    post:
      operationId: decentraleNotificatieVersturen
      summary: Notificatie versturen op basis van een e-mailadres
      description: |
        Verstuurt een notificatie rechtstreeks naar het opgegeven e-mailadres, zonder
        de Profielservice te raadplegen (decentraal profiel / doorgeefluik). De aanroeper
        heeft de contactgegevens zelf al bepaald en geeft het e-mailadres mee. Als een
        callbackUrl is meegegeven, stuurt de NMC asynchroon een statusupdate (CloudEvents)
        zodra de bezorgstatus bekend is.
      tags:
        - DecentraleNotificaties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecentraleNotificatieAanvraagRequest'
      callbacks:
        statusupdate:
          '{$request.body#/callbackUrl}':
            post:
              summary: Statusupdate (CloudEvents NL GOV)
              description: |
                De NMC stuurt deze callback zodra NotifyNL de bezorgstatus terugmeldt,
                en alleen als bij de aanvraag een `callbackUrl` is meegegeven. De
                callback gaat pas uit nadat de status is vastgelegd.

                De NMC doet maximaal drie pogingen met oplopende tussenpozen. Slagen
                die geen van alle, dan wordt de statusupdate niet opnieuw aangeboden;
                de Dienstverlener kan de status dan alleen nog zelf opvragen.

                Een status komt hooguit één keer voorbij. Een herhaalde of laat
                aangekomen melding van NotifyNL die geen vooruitgang is op de al
                vastgelegde status, levert geen callback op — een bezorging wordt dus
                nooit teruggedraaid naar een foutstatus.
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/NotificatieStatusEvent'
              responses:
                '2XX':
                  description: Statusupdate ontvangen
      responses:
        '200':
          description: Notificatie succesvol verstuurd
          headers:
            API-Version:
              schema:
                type: string
              description: Versie van de API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificatieResponse'
        '400':
          description: Ongeldige aanvraag (bijv. ontbrekend/ongeldig e-mailadres of onbekend berichttype)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: De notificatie kon niet (succesvol) verzonden worden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  schemas:
    IdentificatieType:
      type: string
      description: Type identificatie van de ontvanger
      enum:
        - BSN
        - KVK
        - RSIN

    NotificatieAanvraagRequest:
      type: object
      description: Aanvraag om een notificatie te versturen
      required:
        - identificatieType
        - identificatieNummer
        - dienstverlener
        - berichtType
      properties:
        identificatieType:
          $ref: '#/components/schemas/IdentificatieType'
        identificatieNummer:
          type: string
          minLength: 1
          description: BSN-, KVK- of RSIN-nummer van de ontvanger
        dienstverlener:
          type: string
          minLength: 1
          description: Naam van de dienstverlener namens wie de notificatie wordt verstuurd
        dienst:
          type: string
          minLength: 1
          description: Naam van de dienst waarvoor de notificatie wordt verstuurd (optioneel)
        berichtType:
          type: string
          minLength: 1
          description: "Type bericht dat verstuurd wordt (bepaalt de te gebruiken template). Geaccepteerde berichttype(n) zijn:\n- Stuurgroep Agenda\n- Demo template"
        berichtgegevens:
          type: object
          description: Templatevariabelen voor het bericht
          additionalProperties:
            type: string
        callbackUrl:
          type: string
          format: uri
          description: >-
            Optionele URL waarop de NMC asynchroon een statusupdate (CloudEvents NL GOV)
            terugstuurt zodra de bezorgstatus bekend is. Weglaten als de
            Dienstverlener de status zelf opvraagt via GET /notificaties/{id}.

    DecentraleNotificatieAanvraagRequest:
      type: object
      description: >-
        Aanvraag om een notificatie te versturen naar een reeds bekend e-mailadres
        (decentraal profiel; geen Profielservice-lookup)
      required:
        - emailAdres
        - berichtType
      properties:
        emailAdres:
          type: string
          format: email
          # De generator maakt hier geen @Email van, dus het formaat staat expliciet als
          # `pattern`.
          pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
          description: E-mailadres van de ontvanger
        berichtType:
          type: string
          minLength: 1
          description: "Type bericht dat verstuurd wordt (bepaalt de te gebruiken template). Geaccepteerde berichttype(n) zijn:\n- Stuurgroep Agenda\n- Demo template"
        berichtgegevens:
          type: object
          description: Templatevariabelen voor het bericht
          additionalProperties:
            type: string
        callbackUrl:
          type: string
          format: uri
          description: >-
            Optionele URL waarop de NMC asynchroon een statusupdate (CloudEvents NL GOV)
            terugstuurt zodra de bezorgstatus bekend is.

    NotificatieResponse:
      type: object
      required:
        - notificatieId
      properties:
        notificatieId:
          type: string
          format: uuid
          description: NMC-interne referentie voor deze notificatie

    NotificatieStatusEvent:
      type: object
      description: >-
        Statusupdate als CloudEvent (NL GOV profiel). De envelop volgt CloudEvents 1.0;
        de bezorgstatus zelf staat in `data`.
      required:
        - specversion
        - id
        - type
        - source
        - time
        - datacontenttype
        - data
      properties:
        specversion:
          type: string
          example: '1.0'
        id:
          type: string
          format: uuid
          description: Unieke identificatie van dit event, niet van de notificatie
        type:
          type: string
          example: nl.rijksoverheid.moz.nmc.notificatie.status
        source:
          type: string
          format: uri-reference
          example: /api/nmc/v1/notificaties/3f1a...
        subject:
          type: string
          example: notificatie/3f1a...
        time:
          type: string
          format: date-time
          description: Tijdstip waarop de NMC dit event verstuurde
        datacontenttype:
          type: string
          example: application/json
        data:
          $ref: '#/components/schemas/NotificatieStatusData'

    NotificatieStatusData:
      type: object
      required:
        - notificatieId
        - status
      properties:
        notificatieId:
          type: string
          format: uuid
          description: De NMC-interne referentie die bij de aanvraag is teruggegeven
        status:
          $ref: '#/components/schemas/NotificatieStatus'

    NotificatieStatus:
      type: string
      description: |
        Bezorgstatus van de notificatie.

        De eerste zes waarden komen overeen met het delivery-receiptmodel van
        NotifyNL voor e-mail. `onbekend` is een waarde van de NMC zelf.

        | Waarde | Betekenis |
        |---|---|
        | `created` | Door de NMC vastgelegd, nog niet aangeboden bij NotifyNL |
        | `sending` | Aangeboden bij NotifyNL, nog geen uitkomst |
        | `delivered` | Bezorgd |
        | `temporary-failure` | Niet bezorgd; de e-mailprovider is tot 72 uur blijven proberen |
        | `permanent-failure` | Niet bezorgd; het adres is ongeldig |
        | `technical-failure` | Niet bezorgd door een storing aan de verzendkant |
        | `onbekend` | NotifyNL meldde een status die de NMC niet kent |

        `onbekend` betekent niet dat er iets mis is met de notificatie zelf: de NMC
        heeft wél een terugmelding ontvangen, maar die viel buiten de statussen die
        dit component kent. Dat gebeurt bijvoorbeeld als NotifyNL zijn vocabulaire
        uitbreidt of als er een ander kanaal dan e-mail in het spel komt. De melding
        wordt vastgelegd en de NMC logt hem, zodat de waarde alsnog toegevoegd kan
        worden. Behandel `onbekend` niet als eindstatus: er kan later alsnog een
        bekende uitkomst binnenkomen.
      enum:
        - created
        - sending
        - delivered
        - temporary-failure
        - permanent-failure
        - technical-failure
        - onbekend

    Problem:
      type: object
      description: Problem Details (RFC 9457)
      properties:
        type:
          type: string
          format: uri
          default: "about:blank"
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
