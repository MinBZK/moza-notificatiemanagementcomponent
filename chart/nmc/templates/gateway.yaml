{{- if .Values.gateway.enabled }}
{{- $g := .Values.gateway }}
{{- $host := required "gateway.hostname is verplicht" $g.hostname }}
# Een eigen Envoy Gateway met een publiek adres. Alleen de paden in gateway.paths gaan naar de NMC; de
# API zelf blijft van buitenaf dicht, want de NMC heeft nog geen authenticatie.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nmc
  labels:
    {{- include "nmc.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ $g.className }}
  listeners:
    # Poort 80 alleen voor de HTTP-01-challenge van Let's Encrypt; er hangt geen route aan.
    - name: http
      hostname: {{ $host }}
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      hostname: {{ $host }}
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: nmc-gateway-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: nmc-letsencrypt
  labels:
    {{- include "nmc.labels" . | nindent 4 }}
spec:
  acme:
    server: {{ $g.acmeServer }}
    privateKeySecretRef:
      name: nmc-letsencrypt-account
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: nmc
                sectionName: http
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nmc-gateway-tls
  labels:
    {{- include "nmc.labels" . | nindent 4 }}
spec:
  secretName: nmc-gateway-tls
  dnsNames:
    - {{ $host }}
  issuerRef:
    kind: Issuer
    name: nmc-letsencrypt
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nmc
  labels:
    {{- include "nmc.labels" . | nindent 4 }}
spec:
  hostnames:
    - {{ $host }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: nmc
      sectionName: https
  rules:
    - matches:
        {{- range $g.paths }}
        - path:
            type: {{ .type }}
            value: {{ .value }}
        {{- end }}
      backendRefs:
        - name: nmc
          port: {{ .Values.service.port }}
{{- with $g.address }}
---
# external-dns (source crd) maakt hiermee het A-record. Het adres krijgt de Gateway pas na het
# aanmaken, dus dit komt er bij een tweede helm upgrade bij.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: nmc
  labels:
    {{- include "nmc.labels" $ | nindent 4 }}
spec:
  endpoints:
    - dnsName: {{ $host }}
      recordType: A
      targets:
        - {{ . }}
{{- end }}
{{- end }}
