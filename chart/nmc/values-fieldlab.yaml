# Gedeelde Fundament-omgeving van het fieldlab (fundament-poc.nl, cluster-c, project notificatiedienst).
# Fundament zet het project voor de namespace: tnt-notificatiedienst--<namespace>.
image:
  # ghcr.io/minbzk/moza-notificatiemanagementcomponent:pr-123 op 25 november 2026 (665735d): als c15d0ca plus de
  # inzage in het logboek (feature/ldv-inzage-fieldlab), tegen de oude base 369a457. Zie #123 voor wat er na het
  # fieldlab moet. Zonder inzage (1637-nmc-op-fundament): sha256:f855d8bb…20164a1b.
  digest: sha256:d44aff27734f1abc07a5e5c65d4f197dcf60e6273766becbd3c26f79ee4055ce

profielservice:
  # Via FSC, groep fsc-fieldlab (plugin OpenFSC (RINIS), Directory op cluster A): de outway van peer
  # 19000000000000000010 in tnt-notificatiedienst--fsc-fieldlab, grant link `profielservice` naar peer
  # 19000000000000000011. Terug naar het MOZa FSC-testnet (#1661): http://nmc-fscoutway:8080/profielservice.
  # Zonder FSC: http://moza-mock.tnt-notificatiedienst--mock-profielservice.svc:8080
  url: http://fsc-outway-nmc-outway.tnt-notificatiedienst--fsc-fieldlab.svc/profielservice
notify:
  # De demo-NotifyNL van het LPC (Logius), met dezelfde key als ZAD; Logius laat alleen het egress-IP van
  # cluster-c door. De templates in BerichtType zijn van deze NotifyNL. De receipt-callback staat in het
  # dashboard op de NMC van ZAD, dus deze NMC vraagt de status zelf na.
  # Worth: https://api.notifynl.nl, met NMC_BELEID_DEMO_TEMPLATE_TEMPLATE_ID=a1f49022-846c-420d-b7f7-dd7b328f1474
  # in extraEnv en zonder trustCertsFile. De mock: http://moza-mock.tnt-notificatiedienst--mock-notifynl.svc:8080/notifynl/lokaal
  url: https://api.notify.demo.test-basisdienst.nl
  # De server stuurt alleen zijn eigen certificaat, zonder de intermediate certSIGN Web CA (geldig tot
  # 6 februari 2027). Die uit de AIA van het servercert, gecontroleerd tegen certSIGN ROOT CA G2.
  trustCertsFile: certs/certsign-web-ca.pem

webhook:
  jwtKeyId: fieldlab-1

feed:
  # Placeholder-OIN, net als de geconfigureerde dienstverlener uit migratie V8.
  source: urn:nld:oin:00000000000000000000:systeem:nmc

gateway:
  enabled: true
  # Zoals fbs-magazijn.cluster-c.fieldlab2026.nl van het FBS; external-dns beheert dat domein.
  hostname: nmc.cluster-c.fieldlab2026.nl
  # Kreeg de Gateway bij de eerste installatie (23 november 2026); nieuwe Gateway, nieuw adres.
  address: 194.135.48.139
  # Net als op ZAD de hele NMC publiek, zodat een dienstverlener-mock buiten Fundament hem kan bellen.
  # Let op: de NMC heeft nog geen authenticatie.
  paths:
    - type: PathPrefix
      value: /
  # FSC-peers op het MOZa FSC-testnet (chart fsc-peer, #1661): manager en inway van de NMC en de mock.
  passthrough:
    - name: nmc-fscmgr
      hostname: nmc-fscmgr.cluster-c.fieldlab2026.nl
      namespace: tnt-notificatiedienst--nmc
    - name: nmc-fscinway
      hostname: nmc-fscinway.cluster-c.fieldlab2026.nl
      namespace: tnt-notificatiedienst--nmc
    - name: ps-fscmgr
      hostname: ps-fscmgr.cluster-c.fieldlab2026.nl
      namespace: tnt-notificatiedienst--mock-profielservice
    - name: ps-fscinway
      hostname: ps-fscinway.cluster-c.fieldlab2026.nl
      namespace: tnt-notificatiedienst--mock-profielservice

logboekdataverwerking:
  enabled: true
  # fail-open tijdens het fieldlab: de PostgreSQL-backend van het Logboek is hier nieuw, en een schrijffout
  # zou anders de aanname van een notificatie laten falen (500). Na het fieldlab terug naar fail-closed.
  writeFailurePolicy: fail-open
  postgres:
    create: true
  # Voor de demo: de inzage per betrokkene, open via nmc.cluster-c.fieldlab2026.nl, naast die van het FBS.
  inzage: true

postgres:
  # De CloudNativePG-operator op dit cluster komt van Haven+, met deze catalogus (PG 15 tot en met 18).
  imageCatalog: postgresql-standard-trixie
  storage:
    size: 2Gi
    # Leeg: de default storageClass van het cluster (ceph-incluster).
